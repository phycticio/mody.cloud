services:
  nginx:
    container_name: ${CONTAINER_PREFIX:-wp_}server
    image: nginx:alpine
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    volumes:
      - ./app:/var/www/html
      - ./config/nginx/app.conf.template:/etc/nginx/templates/app.conf.template:ro
      - ./config/nginx/mailpit.conf.template:/etc/nginx/templates/mailpit.conf.template:ro
      # Sourced from mkcert-generated files by default (local dev only).
      # Stage/production set NGINX_SSL_CERT_FILE/NGINX_SSL_KEY_FILE to a
      # harmless existing file (e.g. /dev/null) in their .env — TLS is
      # terminated upstream (NPM/load balancer) there, NGINX_APP_SSL_DIRECTIVES
      # is emptied via a compose override, and nginx never reads these paths,
      # so no real certificate content — and no mkcert — is required.
      - ${NGINX_SSL_CERT_FILE:-./config/ssl/local-cert.pem}:/etc/nginx/ssl/cert.pem:ro
      - ${NGINX_SSL_KEY_FILE:-./config/ssl/local-key.pem}:/etc/nginx/ssl/key.pem:ro
    depends_on:
      - wordpress
    restart: unless-stopped
    environment:
      PROXY_NAME: ${PROXY_NAME:-localhost}
      HOST_NAME: ${HOST_NAME:-localhost}
      MAIL_HOST: ${MAIL_HOST:-mail.localhost}
      ENVIRONMENT: ${ENVIRONMENT:-local}
      ENVIRONMENT_DOMAIN: ${ENVIRONMENT:-test.local}
      SSH_HOST_PRODUCTION: ${SSH_HOST_PRODUCTION:-test.com}
      SSH_HOST_STAGE: ${SSH_HOST_STAGE:-stage.test.com}
      CLIENT_MAX_BODY: ${WORDPRESS_MEMORY_LIMIT:-256M}
      NGINX_APP_LISTEN: "443 ssl http2"
      NGINX_APP_SERVER_NAME: "${HOST_NAME:-mody.cloud.local}"
      NGINX_APP_SSL_DIRECTIVES: |
        ssl_certificate /etc/nginx/ssl/cert.pem;
        ssl_certificate_key /etc/nginx/ssl/key.pem;
      NGINX_HTTP_REDIRECT_SERVER: |
        server {
            listen 80;
            server_name ${HOST_NAME:-mody.cloud.local};

            return 301 https://$$host$$request_uri;
        }
    networks:
      default:
        aliases:
          - ${HOST_NAME:-mody.cloud.local}

  wordpress:
    container_name: ${CONTAINER_PREFIX:-wp_}app
    image: ${CONTAINER_PREFIX:-wp_}wordpress:${WORDPRESS_IMAGE_VERSION:-latest-fpm-alpine}
    pull_policy: never
    labels:
      ofelia.enabled: "true"
      ofelia.job-exec.tamarind_newsletters_due.schedule: "${OFELIA_NEWSLETTERS_SCHEDULE:-@every 5m}"
      ofelia.job-exec.tamarind_newsletters_due.command: "wp tamarind newsletters run-due --network"
      ofelia.job-exec.tamarind_newsletters_due.user: "www-data"
      ofelia.job-exec.tamarind_newsletters_due.no-overlap: "true"
    ports:
        - "9003:9003"
    build:
      context: ./config
      dockerfile: Dockerfile
      args:
        - WORDPRESS_IMAGE_VERSION=${WORDPRESS_IMAGE_VERSION:-latest-fpm-alpine}
        - USER_ID=${USER_ID:-1000}
        - GROUP_ID=${GROUP_ID:-1000}
    volumes:
      - ./app:/var/www/html
      - ./config/php/uploads.ini:/usr/local/etc/php/conf.d/uploads.ini
      - ./config/php/sendmail.ini:/usr/local/etc/php/conf.d/sendmail.ini
      - ./config/php/zzz-mail.ini:/usr/local/etc/php/conf.d/zzz-mail.ini:ro
      - ./config/php/xdebug.ini:/usr/local/etc/php/conf.d/xdebug.ini:ro
    env_file:
      - .env
    environment:
      WORDPRESS_DB_HOST: wp_db
      WORDPRESS_DB_NAME: $DB_NAME
      WORDPRESS_DB_USER: $DB_USER
      WORDPRESS_DB_PASSWORD: $DB_PASSWORD
      WORDPRESS_TABLE_PREFIX: $WORDPRESS_TABLE_PREFIX
      WORDPRESS_DEBUG: ${WORDPRESS_DEBUG:-0}
      WORDPRESS_CONFIG_EXTRA: |
        define( 'WP_MEMORY_LIMIT', '${WORDPRESS_MEMORY_LIMIT:-256M}' );
        define( 'WP_ENV', '${WORDPRESS_ENVIRONMENT:-local}' );
        define( 'WP_ENVIRONMENT_TYPE', '${WORDPRESS_ENVIRONMENT:-local}' );
        define( 'WP_AUTO_UPDATE_CORE', ${WORDPRESS_AUTO_UPDATE_CORE:-false} );
        define( 'WP_POST_REVISIONS', ${WORDPRESS_POST_REVISIONS:-5} );
        define( 'WP_DEBUG_LOG', '${WORDPRESS_DEBUG_LOG:-/var/www/html/logs/debug.log}' );
        define( 'WP_DEBUG_DISPLAY', ${WORDPRESS_DEBUG_DISPLAY:-0} );
        define( 'FORCE_SSL_ADMIN', ${WORDPRESS_FORCE_SSL_ADMIN:-true} );
        define( 'DISALLOW_FILE_EDIT', ${WORDPRESS_DISALLOW_FILE_EDIT:-true} );
        define( 'WPMS_ON', ${WORDPRESS_SMTP_ON:-true} );
        define( 'AUTOMATIC_UPDATER_DISABLED', ${WORDPRESS_AUTOMATIC_UPDATER_DISABLED:-false} );
        define( 'DISALLOW_FILE_MODS', ${WORDPRESS_DISALLOW_FILE_MODS:-false} );
        define( 'CONCATENATE_SCRIPTS', ${WORDPRESS_CONCATENATE_SCRIPTS:-true} );
        define( 'EMPTY_TRASH_DAYS', ${WORDPRESS_EMPTY_TRASH_DAYS:-7} );
        define( 'COMPRESS_CSS', ${WORDPRESS_COMPRESS_CSS:-true} );
        define( 'COMPRESS_SCRIPTS', ${WORDPRESS_COMPRESS_SCRIPTS:-true} );
        define( 'ENFORCE_GZIP', ${WORDPRESS_ENFORCE_GZIP:-true} );
        define( 'DISABLE_WP_CRON', ${WORDPRESS_DISABLE_WP_CRON:-false} );
        if ( defined( 'WP_CLI' ) && WP_CLI ) {
            @ini_set( 'display_errors', 0 );
            error_reporting( E_ALL & ~E_NOTICE & ~E_DEPRECATED );
        }
      ENVIRONMENT: ${ENVIRONMENT:-local}
      ENVIRONMENT_DOMAIN: ${ENVIRONMENT:-test.local}
      SSH_HOST_PRODUCTION: ${SSH_HOST_PRODUCTION:-test.com}
      SSH_HOST_STAGE: ${SSH_HOST_STAGE:-stage.test.com}
      WORDPRESS_ALLOW_MULTISITE: ${WORDPRESS_ALLOW_MULTISITE:-false}
      WORDPRESS_MULTISITE: ${WORDPRESS_MULTISITE:-false}
      WORDPRESS_SUBDOMAIN_INSTALL: ${WORDPRESS_SUBDOMAIN_INSTALL:-false}
    depends_on:
      wp_db:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    networks:
      - default

  wp_db:
    container_name: ${CONTAINER_PREFIX:-wp_}db
    image: mariadb:11.4.7
    restart: unless-stopped
    ports:
      - "${DB_HOST_PORT:-3306}:3306"
    volumes:
      - wp_data:/var/lib/mysql
      - ./config/my.cnf:/etc/mysql/conf.d/custom.cnf
    environment:
      MARIADB_ROOT_PASSWORD: $DB_ROOT_PASSWORD
      MARIADB_DATABASE: $DB_NAME
      MARIADB_USER: $DB_USER
      MARIADB_PASSWORD: $DB_PASSWORD
    env_file:
      - .env
    healthcheck:
      test: [ "CMD", "healthcheck.sh", "--su-mysql", "--connect", "--innodb_initialized" ]
      start_period: 1m
      start_interval: 10s
      interval: 1m
      timeout: 5s
      retries: 3
    networks:
      - default

  redis:
    container_name: ${CONTAINER_PREFIX:-wp_}redis
    image: redis:alpine
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - default

  mailpit:
    image: axllent/mailpit
    container_name: ${CONTAINER_PREFIX:-wp_}mail
    restart: unless-stopped
    volumes:
      - mail_data:/data
    environment:
      MP_MAX_MESSAGES: 5000
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    networks:
      - default

volumes:
  wp_data:
    name: ${CONTAINER_PREFIX:-wp_}data
  mail_data:
    name: ${CONTAINER_PREFIX:-wp_}mail_data

networks:
  default:
    driver: bridge
    name: ${CONTAINER_PREFIX:-wp_}network
